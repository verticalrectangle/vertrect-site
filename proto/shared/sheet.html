<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rect model sheet</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="base.css">
<style>
  body { padding: 32px; }
  h1 { font-size: 40px; margin-bottom: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 24px; margin: 24px 0; align-items: end; }
  figure { border: var(--border); box-shadow: var(--shadow); background: var(--surface); padding: 12px; }
  figure.poster { background: var(--gold); }
  :root[data-theme='dark'] figure.poster { background: #000; }
  figcaption { font: 600 12px 'JetBrains Mono', monospace; margin-top: 8px; text-transform: uppercase; }
  svg.rect { width: 160px; height: 192px; }
  svg.logo { width: 120px; height: 120px; }
  button { border: var(--border); background: var(--surface); color: var(--ink); padding: 8px 14px; box-shadow: var(--shadow-sm); }
</style>
</head>
<body>
<h1 class="wordmark">Vertical<br>Rectangle</h1>
<button data-theme-toggle><span class="theme-light-label">Light</span><span class="theme-dark-label">Dark</span></button>
<div class="row">
  <figure><svg class="logo"><use href="sprite.svg#logo"/></svg><figcaption>logo</figcaption></figure>
  <figure><svg class="logo"><use href="sprite.svg#logo-outline"/></svg><figcaption>logo outline</figcaption></figure>
</div>
<div class="row" id="memphis"></div>
<div class="row" id="sil"></div>
<script>
  const poses = ['rect-wave','rect-mic','rect-gpu','rect-dance','rect-casual','hrect-suit'];
  for (const [id, cls, fig] of [['memphis','',''],['sil','rect--silhouette','poster']])
    document.getElementById(id).innerHTML = poses.map(p =>
      `<figure class="${fig}"><svg class="rect ${cls}" viewBox="0 0 200 240"><use href="sprite.svg#${p}"/></svg><figcaption>${p}</figcaption></figure>`).join('');
</script>
</body>
</html>
