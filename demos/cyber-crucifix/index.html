<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CYBER CRUCIFIX — psychedelic 3D</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; }

  .hud {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 10;
    font-family: "Courier New", ui-monospace, monospace;
    user-select: none;
  }
  .title {
    position: absolute; top: 5.5vh; width: 100%; text-align: center;
    color: #fff; letter-spacing: 0.42em; font-weight: 900; font-size: clamp(18px, 3.4vw, 44px);
    text-shadow: 0 0 22px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.9), 0.055em 0 0 #ff00cc, -0.055em 0 0 #00ffff;
    animation: glitchTitle 2.8s steps(1) infinite;
  }
  .title small {
    display: block; font-size: 0.36em; letter-spacing: 0.85em; font-weight: 400;
    color: #bff0ff; margin-top: 0.9em; opacity: 0.9;
    text-shadow: 0.04em 0 0 #ff00cc, -0.04em 0 0 #00ffff;
  }
  .hint {
    position: absolute; right: 1.4em; bottom: 1.1em; text-align: right;
    color: #a8e8ff; font-size: 13px; letter-spacing: 0.14em; line-height: 1.9; opacity: 0.75;
  }
  .hint b { color: #ff8ae0; font-weight: 700; }
  #err {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 20; max-width: 80vw; padding: 1.2em 1.6em;
    background: #20040f; border: 1px solid #ff3366; color: #ffb3c6;
    font: 13px/1.6 "Courier New", monospace; white-space: pre-wrap;
    box-shadow: 0 0 30px rgba(255, 0, 80, 0.5);
  }

  @keyframes glitchTitle {
    0%, 100% { transform: translate(0, 0); }
    7%  { transform: translate(-3px, 1px) skewX(6deg); }
    9%  { transform: translate(3px, -1px) skewX(-5deg); }
    11% { transform: translate(0, 0); }
    43% { transform: translate(0, 0); }
    46% { transform: translate(-5px, 2px) skewX(-8deg); }
    48% { transform: translate(4px, -2px); }
    50% { transform: translate(0, 0); }
    71% { transform: translate(0, 0); }
    74% { transform: translate(2px, -1px) skewX(7deg); }
    76% { transform: translate(0, 0); }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="title">CYBER CRUCIFIX<small>PSYCHEDELIC RENDER</small></div>
  <div class="hint">
    <b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom<br/>
    chroma melt · chroma frame · rgb split · strobe
  </div>
</div>
<div id="err" hidden></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/shaders/CopyShader.js"></script>
<script src="vendor/shaders/LuminosityHighPassShader.js"></script>
<script src="vendor/EffectComposer.js"></script>
<script src="vendor/RenderPass.js"></script>
<script src="vendor/ShaderPass.js"></script>
<script src="vendor/UnrealBloomPass.js"></script>
<script src="main.js"></script>
</body>
</html>
